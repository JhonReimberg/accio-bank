# Secrets come from .env (copy .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bank
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Bank: Host=db;Port=5432;Database=bank;Username=bank;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: bank-api
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      # nginx (web) sits in front: trust X-Forwarded-For for client IPs (audit log, rate limiting).
      ForwardedHeaders__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
